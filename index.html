<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoBlock BBGTK DIY - General Physics & Mechanics Simulation</title>
  
  <!-- Blockly CDN Core & Generators -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/id.js"></script>

  <!-- Three.js & Cannon.es Physics Engine CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #app-header { height: 50px; background-color: #1e1e2f; color: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { height: 32px; width: auto; object-fit: contain; }
    #app-header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
    
    .control-group { display: flex; gap: 8px; align-items: center; }
    .btn { border: none; padding: 8px 16px; font-size: 0.9rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; color: white; }
    #btn-render { background-color: #28a745; }
    #btn-render:hover { background-color: #218838; }
    #btn-play { background-color: #007bff; }
    #btn-play:hover { background-color: #0069d9; }
    #btn-reset { background-color: #dc3545; }
    #btn-reset:hover { background-color: #c82333; }

    #main-container { display: flex; width: 100vw; height: calc(100vh - 50px); }
    #blockly-div { width: 55%; height: 100%; }
    #viewport-container { width: 45%; height: 100%; position: relative; background-color: #141419; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #code-preview { position: absolute; bottom: 10px; left: 10px; right: 10px; height: 100px; background: rgba(0, 0, 0, 0.75); color: #00ff66; font-family: 'Courier New', Courier, monospace; font-size: 12px; padding: 10px; border-radius: 6px; overflow-y: auto; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="header-left">
      <img src="bbgtk diy logo.png" alt="Logo BBGTK DIY" class="header-logo">
      <h1>GeoBlock BBGTK DIY - 3D Physics & Mechanics Laboratory</h1>
    </div>
    <div class="control-group">
      <button id="btn-render" class="btn" onclick="renderScene()">Build Model</button>
      <button id="btn-play" class="btn" onclick="toggleSimulation()">Play Simulasi</button>
      <button id="btn-reset" class="btn" onclick="resetSimulation()">Reset</button>
    </div>
  </header>

  <main id="main-container">
    <div id="blockly-div"></div>
    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <pre id="code-preview">// Kode JavaScript tergenerasi akan muncul di sini...</pre>
    </div>
  </main>

  <!-- Modul Custom Blocks 3D & 2D JS -->
  <script src="block_cube.js"></script>
  <script src="block_sphere.js"></script>
  <script src="block_cylinder.js"></script>
  <script src="block_torus.js"></script>
  <script src="block_circle.js"></script>
  <script src="block_square.js"></script>

  <!-- Modul Custom Blocks Transformasi & Himpunan -->
  <script src="block_color.js"></script>
  <script src="block_translate.js"></script>
  <script src="block_rotate.js"></script>
  <script src="block_scale.js"></script>
  <script src="block_mirror.js"></script>
  <script src="block_union.js"></script>
  <script src="block_intersection.js"></script>
  <script src="block_difference.js"></script>
  <script src="block_text.js"></script>

  <!-- Modul Fisika General Baru -->
  <script src="block_physics_general.js"></script>

  <script>
    const jsGen = javascript.javascriptGenerator || javascriptGenerator;

    const toolboxXml = `
      <xml id="toolbox" style="display: none">
        <!-- Kategori Fisika General -->
        <category name="Simulasi Fisika" colour="#FF5722">
          <block type="physics_world">
            <value name="GRAVITY"><shadow type="math_number"><field name="NUM">-9.81</field></shadow></value>
          </block>
          <block type="physics_body">
            <value name="MASS"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
            <value name="RESTITUTION"><shadow type="math_number"><field name="NUM">0.7</field></shadow></value>
            <value name="VX"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
            <value name="VY"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
            <value name="VZ"><shadow type="math_number"><field name="NUM">0</field></shadow></value>
          </block>
        </category>

        <!-- Kategori Bentuk 3D -->
        <category name="Bentuk 3D" colour="#4C97FF">
          <block type="shape_cube"></block>
          <block type="shape_sphere"></block>
          <block type="shape_cylinder"></block>
          <block type="shape_torus"></block>
        </category>

        <!-- Kategori Bentuk 2D -->
        <category name="Bentuk 2D" colour="#9C27B0">
          <block type="shape_circle"></block>
          <block type="shape_square"></block>
        </category>

        <!-- Kategori Transformasi -->
        <category name="Transformasi" colour="#FF9800">
          <block type="transform_color_palette"></block>
          <block type="transform_translate"></block>
          <block type="transform_rotate"></block>
          <block type="transform_scale"></block>
        </category>

        <!-- Kategori Operasi Himpunan -->
        <category name="Operasi Himpunan" colour="#E91E63">
          <block type="csg_union"></block>
          <block type="csg_intersection"></block>
          <block type="csg_difference"></block>
        </category>

        <!-- Kategori Matematika & Iterasi -->
        <category name="Matematika" colour="#5B80A5">
          <block type="math_number"><field name="NUM">10</field></block>
          <block type="math_arithmetic"></block>
        </category>
        <category name="Iterasi" colour="#5CA65C">
          <block type="controls_repeat_ext">
            <value name="TIMES"><block type="math_number"><field name="NUM">10</field></block></value>
          </block>
        </category>
      </xml>
    `;

    const workspace = Blockly.inject('blockly-div', {
      toolbox: toolboxXml,
      scrollbars: true,
      zoom: { controls: true, wheel: true, startScale: 1.0 },
      grid: { spacing: 20, length: 3, colour: '#ccc', snap: true }
    });

    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('canvas3d');
    
    // Scene Three.js
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e24);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.up.set(0, 0, 1);
    camera.position.set(40, -50, 30);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(30, -30, 50);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(100, 50, 0x00ffcc, 0x444455);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);

    const renderGroup = new THREE.Group();
    scene.add(renderGroup);

    // Initial Physics World Setup (Cannon.es)
    window.physicsWorld = new CANNON.World();
    window.physicsWorld.gravity.set(0, 0, -9.81);
    window.simulatedObjects = [];

    let isSimulating = false;

    // Lantai Fisika Permanen (Ground Plane)
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    window.physicsWorld.addBody(groundBody);

    function renderScene() {
      resetSimulation();

      // Clear Three.js Render Group
      while(renderGroup.children.length > 0){ 
        const obj = renderGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        renderGroup.remove(obj); 
      }

      // Re-init Physics World Bodies
      window.physicsWorld = new CANNON.World();
      window.physicsWorld.gravity.set(0, 0, -9.81);
      window.physicsWorld.addBody(groundBody);
      window.simulatedObjects = [];

      const code = jsGen.workspaceToCode(workspace);
      document.getElementById('code-preview').innerText = code || "// Workspace kosong";

      try {
        const runCode = new Function('sceneGroup', 'THREE', 'CANNON', code);
        runCode(renderGroup, THREE, CANNON);
      } catch (e) {
        console.error("Error Execution:", e);
      }
    }

    function toggleSimulation() {
      isSimulating = !isSimulating;
      document.getElementById('btn-play').innerText = isSimulating ? "Pause" : "Play Simulasi";
      document.getElementById('btn-play').style.backgroundColor = isSimulating ? "#ffc107" : "#007bff";
    }

    function resetSimulation() {
      isSimulating = false;
      document.getElementById('btn-play').innerText = "Play Simulasi";
      document.getElementById('btn-play').style.backgroundColor = "#007bff";
      renderScene();
    }

    // Animation Loop
    const timeStep = 1 / 60;
    function animate() {
      requestAnimationFrame(animate);

      if (isSimulating) {
        window.physicsWorld.step(timeStep);

        // Update Posisi & Rotasi Visual Mesh dari Physics Body
        window.simulatedObjects.forEach(obj => {
          if (obj.userData && obj.userData.physicsBody) {
            obj.position.copy(obj.userData.physicsBody.position);
            obj.quaternion.copy(obj.userData.physicsBody.quaternion);
          }
        });
      }

      controls.update();
      renderer.render(scene, camera);
    }
    
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
